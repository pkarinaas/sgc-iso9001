<div class="flex h-screen bg-gray-50 w-full overflow-hidden">
  <!-- Sidebar (Left Panel) -->
  <aside
    class="w-64 bg-white border-r border-gray-200 flex flex-col sidebar shrink-0"
    [class.sidebar--hidden]="!isSidebarVisible()"
  >
    <!-- Sidebar Header with Brand and Toggle Button -->
    <div class="p-6 flex items-center justify-between">
      <span class="text-2xl font-bold text-[#800020] tracking-tight">SGC-ISO9001</span>
      <button
        id="btn-toggle-sidebar"
        type="button"
        (click)="toggleSidebar()"
        class="btn-hamburger"
        title="Ocultar barra lateral"
        aria-label="Ocultar barra lateral"
      >
        <i class="pi pi-bars text-xl"></i>
      </button>
    </div>

    <!-- Navigation Links -->
    <nav class="flex-1 px-4 flex flex-col gap-2 overflow-y-auto">
      <a
        routerLink="/users"
        routerLinkActive="!bg-rose-50 !text-[#800020]"
        class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-100 transition-colors cursor-pointer font-medium"
      >
        <i class="pi pi-users text-lg"></i>
        <span>Usuarios</span>
      </a>

      <a
        routerLink="/documents"
        routerLinkActive="!bg-rose-50 !text-[#800020]"
        class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-100 transition-colors cursor-pointer font-medium"
      >
        <i class="pi pi-folder text-lg"></i>
        <span>Repositorio</span>
      </a>
    </nav>

    <!-- Sidebar Footer -->
    <div class="p-4 border-t border-gray-200">
      <button
        id="btn-logout"
        type="button"
        (click)="onLogout()"
        class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-[#800020] hover:bg-rose-50 transition-colors cursor-pointer font-medium text-left"
      >
        <i class="pi pi-sign-out text-lg"></i>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Wrapper (Right Panel) -->
  <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
    <!-- Top bar visible when sidebar is hidden to restore it cleanly -->
    @if (!isSidebarVisible()) {
      <header class="topbar-collapsed">
        <button
          id="btn-open-sidebar"
          type="button"
          (click)="toggleSidebar()"
          class="btn-hamburger"
          title="Mostrar barra lateral"
          aria-label="Mostrar barra lateral"
        >
          <i class="pi pi-bars text-xl"></i>
        </button>
        <span class="text-xl font-bold text-[#800020] tracking-tight">SGC-ISO9001</span>
      </header>
    }

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- Inactivity Warning Dialog -->
<p-dialog
  header="Inactividad detectada"
  [visible]="(isWarningVisible$ | async) ?? false"
  [closable]="false"
  [modal]="true"
  [style]="{ width: '400px' }"
>
  <p class="text-gray-600 m-0 leading-relaxed">
    Tu sesión está a punto de cerrarse por inactividad. ¿Deseas extender la sesión?
  </p>

  <ng-template #footer>
    <div class="flex justify-end mt-4">
      <button
        id="btn-extend-session"
        type="button"
        pButton
        (click)="extendSession()"
        class="flex items-center gap-2 bg-[#881337] hover:bg-[#9f1239] border-none text-white px-5 py-2 rounded-md shadow-sm transition-colors cursor-pointer font-medium"
      >
        <i class="pi pi-check"></i>
        <span>Extender Sesión</span>
      </button>
    </div>
  </ng-template>
</p-dialog>
