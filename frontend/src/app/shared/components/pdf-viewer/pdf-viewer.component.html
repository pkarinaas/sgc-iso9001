<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [maximizable]="true"
  [style]="{ width: '90vw' }"
  [header]="header"
  [closable]="true"
  appendTo="body"
  (onHide)="close()"
>
  @if (src) {
    <ngx-extended-pdf-viewer
      [src]="src"
      [textLayer]="true"
      [showHandToolButton]="true"
      [showPrintButton]="false"
      [showDownloadButton]="false"
      [supportsDownloading]="false"
      [ignoreKeys]="pdfViewerIgnoreKeys"
      [contextMenuAllowed]="false"
      [showOpenFileButton]="false"
      [showSecondaryToolbarButton]="false"
      [showEditorButtons]="false"
      [enablePrint]="false"
      [height]="'80vh'"
    ></ngx-extended-pdf-viewer>

    @if (requiresAcknowledgement) {
      <div class="flex align-items-center gap-2 mt-3 p-3 border-top-1 surface-border bg-surface-50">
        <p-checkbox [(ngModel)]="acknowledgementChecked" [binary]="true" inputId="ack-check"></p-checkbox>
        <label for="ack-check" class="cursor-pointer font-medium text-color-secondary">
          Declaro haber leído y comprendido las directrices de este documento.
        </label>
        <button 
          pButton 
          type="button"
          label="Confirmar lectura" 
          icon="pi pi-check" 
          class="ml-auto" 
          severity="primary"
          [disabled]="!acknowledgementChecked"
          (click)="confirmAcknowledgement()"
        >
          <i class="pi pi-check"></i>
          <span>Confirmar lectura</span>
        </button>
      </div>
    }
  }
</p-dialog>
